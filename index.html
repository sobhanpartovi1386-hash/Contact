<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>استودیو تپش</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 15%, rgba(0,255,220,.14), transparent 32%),
        #050505;
    color: #fff;
    font-family: 'Vazirmatn', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 90%;
    max-width: 430px;
    text-align: center;
}

.title {
    font-size: 38px;
    font-weight: 800;
    margin-bottom: 8px;
    text-shadow:
        0 0 8px rgba(0,255,220,.9),
        0 0 25px rgba(0,255,220,.5);
}

.subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 35px;
}

.links {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.link {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 62px;
    border-radius: 18px;
    text-decoration: none;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(0,255,220,.35);
    box-shadow:
        0 0 15px rgba(0,255,220,.08),
        inset 0 0 20px rgba(0,255,220,.03);
    backdrop-filter: blur(12px);
    transition: .25s ease;
}

.link:hover {
    transform: translateY(-3px);
    border-color: #00ffdc;
    box-shadow:
        0 0 15px rgba(0,255,220,.5),
        0 0 35px rgba(0,255,220,.18);
}

.link:active {
    transform: scale(.97);
}

.icon {
    position: absolute;
    right: 20px;
    font-size: 23px;
}

.phone:hover {
    border-color: #00ff95;
    box-shadow: 0 0 20px rgba(0,255,150,.5);
}

.instagram:hover {
    border-color: #ff0099;
    box-shadow: 0 0 20px rgba(255,0,150,.5);
}

.telegram:hover {
    border-color: #00aaff;
    box-shadow: 0 0 20px rgba(0,170,255,.5);
}

.footer {
    margin-top: 30px;
    color: #444;
    font-size: 11px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">استودیو تپش</div>

    <div class="subtitle">
        برای ارتباط با ما انتخاب کنید
    </div>

    <div class="links">

        <a class="link phone" href="tel:+989196826138">
            <span class="icon">📞</span>
            09196826138
        </a>

        <a class="link instagram"
           href="https://instagram.com/studio_tapesh1">
            <span class="icon">◎</span>
            Instagram
        </a>

        <a class="link telegram"
           href="https://t.me/studio_tapesh1">
            <span class="icon">➤</span>
            Telegram
        </a>

    </div>

    <div class="footer">
        STUDIO TAPESH
    </div>

</div>

</body>
</html>
