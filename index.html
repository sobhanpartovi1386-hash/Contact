<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<title>استودیو تپش</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at 50% 5%, rgba(0,255,220,.22), transparent 30%),
        radial-gradient(circle at 10% 90%, rgba(255,0,170,.12), transparent 28%),
        radial-gradient(circle at 90% 80%, rgba(0,150,255,.14), transparent 28%),
        #020304;

    color: #fff;
    font-family: 'Vazirmatn', sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.container {
    width: 90%;
    max-width: 430px;
    text-align: center;
}

/* عنوان */

.title {
    font-size: 40px;
    font-weight: 800;

    margin-bottom: 8px;

    background: linear-gradient(
        90deg,
        #00ffe0,
        #ffffff,
        #00c8ff
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow:
        0 0 15px rgba(0,255,220,.55),
        0 0 35px rgba(0,255,220,.25);
}

.subtitle {
    color: #9aa5a8;
    font-size: 14px;
    margin-bottom: 35px;
}

/* دکمه ها */

.links {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.link {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 64px;

    border-radius: 20px;

    text-decoration: none;
    color: #fff;

    font-size: 17px;
    font-weight: 600;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.025)
        );

    border: 1px solid rgba(0,255,220,.35);

    box-shadow:
        0 0 18px rgba(0,255,220,.12),
        inset 0 0 25px rgba(0,255,220,.035);

    backdrop-filter: blur(18px);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
}

/* نور داخل دکمه */

.link::before {
    content: "";

    position: absolute;
    inset: 0;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.07),
            transparent
        );

    opacity: 0;

    transition: .3s;
}

.link:hover::before {
    opacity: 1;
}

.link:hover {
    transform: translateY(-4px);
}

.link:active {
    transform: scale(.97);
}

/* آیکون */

.icon {
    position: absolute;
    right: 20px;

    width: 27px;
    height: 27px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.icon svg {
    width: 26px;
    height: 26px;
}

/* تماس */

.phone {
    border-color: rgba(0,255,150,.4);
}

.phone:hover {
    border-color: #00ff9d;

    box-shadow:
        0 0 20px rgba(0,255,150,.55),
        0 0 45px rgba(0,255,150,.18),
        inset 0 0 25px rgba(0,255,150,.08);
}

/* اینستاگرام */

.instagram {
    border-color: rgba(255,0,150,.45);
}

.instagram:hover {
    border-color: #ff2bb5;

    box-shadow:
        0 0 20px rgba(255,0,150,.65),
        0 0 50px rgba(255,0,150,.2),
        inset 0 0 25px rgba(255,0,150,.08);
}

/* تلگرام */

.telegram {
    border-color: rgba(0,180,255,.45);
}

.telegram:hover {
    border-color: #00bfff;

    box-shadow:
        0 0 20px rgba(0,180,255,.65),
        0 0 50px rgba(0,180,255,.2),
        inset 0 0 25px rgba(0,180,255,.08);
}

/* فوتر */

.footer {
    margin-top: 32px;

    color: #596164;

    font-size: 11px;

    letter-spacing: 3px;
}

/* موبایل */

@media (max-width: 480px) {

    .title {
        font-size: 36px;
    }

    .link {
        min-height: 62px;
    }

}

</style>
</head>
